services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-app
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ./src/.env
    environment:
      - USE_SSL=false
      - PORT=8000
      - HOST=0.0.0.0
      - GOOGLE_SITE_VERIFICATION=${GOOGLE_SITE_VERIFICATION:-}
    volumes:
      - ./logs:/app/logs
      - ./markdown:/app/markdown:ro
      - ./csv:/app/csv:ro
      - ./videos:/app/videos:ro
      - ./src:/app/src:ro
      - ./static:/app/static:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/robots.txt"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - portfolio-network

  nginx:
    image: nginx:alpine
    container_name: portfolio-nginx
    restart: unless-stopped
    ports:
      - "192.168.0.104:80:80"
      - "192.168.0.104:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src/certificates:/etc/nginx/certificates:ro
      - ./static:/usr/share/nginx/html/static:ro
      - ./images:/usr/share/nginx/html/images:ro
      - ./src/sitemap.xml:/usr/share/nginx/html/sitemap.xml:ro
      - ./static/googlec0f02607421c3396.html:/usr/share/nginx/html/googlec0f02607421c3396.html:ro
      - ./.well-known/acme-challenge:/var/www/certbot:ro
    depends_on:
      portfolio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge