<!-- 공통 연락처 대화상자 -->
<div class="mail-overlay mail-container-hidden" id="mailOverlay" hidden>
    <div class="mail-modal" role="dialog" aria-modal="true" aria-labelledby="mailModalTitle" tabindex="-1">
        <div class="mail-modal-header">
            <h2 class="mail-modal-title" id="mailModalTitle">이메일 문의</h2>
            <button type="button" class="mail-modal-close" onclick="closeEmailModal()" aria-label="문의 창 닫기">
                <span aria-hidden="true">×</span>
            </button>
        </div>
        
        <p class="mail-contact-description">협업 제안이나 문의 내용을 보내주세요. 모든 항목은 필수입니다.</p>
        <p class="mail-direct-contact"><a href="mailto:sjmbee04@gmail.com">sjmbee04@gmail.com</a></p>
        <p id="mailStatus" role="status" aria-live="polite"></p>
        <div class="mail-network-error" id="mailNetworkError" hidden>
            네트워크 연결을 확인해주세요.
        </div>
        
        <div id="mailFormContainer">
            <form class="mail-form" onsubmit="sendEmail(event)" novalidate>
                <div class="mail-form-group">
                    <label class="mail-form-label" for="senderName">이름 *</label>
                    <input 
                        type="text" 
                        id="senderName" 
                        name="sender_name"
                        autocomplete="name"
                        aria-describedby="nameError"
                        class="mail-form-input"
                        required 
                        placeholder="홍길동"
                    >
                    <div class="mail-field-error" id="nameError"></div>
                </div>
                
                <div class="mail-form-group">
                    <label class="mail-form-label" for="senderEmail">
                        회신 이메일 *
                    </label>
                    <input 
                        type="email" 
                        id="senderEmail" 
                        name="sender_email"
                        autocomplete="email"
                        aria-describedby="emailError"
                        class="mail-form-input"
                        required 
                        placeholder="example@email.com"
                    >
                    <div class="mail-field-error" id="emailError"></div>
                </div>
                
                <div class="mail-form-group">
                    <label class="mail-form-label" for="subject">제목 *</label>
                    <input 
                        type="text" 
                        id="subject" 
                        name="subject"
                        aria-describedby="subjectError"
                        class="mail-form-input"
                        required 
                        placeholder="협업 제안 / 문의사항 등"
                    >
                    <div class="mail-field-error" id="subjectError"></div>
                </div>
                
                <div class="mail-form-group">
                    <label class="mail-form-label" for="message">메시지 *</label>
                    <textarea 
                        id="message" 
                        name="message"
                        aria-describedby="messageError"
                        class="mail-form-textarea"
                        required
                        minlength="10"
                        rows="5"
                        placeholder="문의 내용을 10자 이상 입력해주세요."
                    ></textarea>
                    <div class="mail-field-error" id="messageError"></div>
                </div>
                
                <div class="mail-form-buttons">
                    <button type="button" class="mail-form-cancel" onclick="closeEmailModal()">
                        취소
                    </button>
                    <button type="submit" class="mail-form-submit" id="mailSubmitButton">
                        보내기
                    </button>
                </div>
            </form>
        </div>
        
        <div id="mailSuccessContainer" class="mail-container-hidden" hidden>
            <div class="mail-success-message">
                <h3 class="mail-success-title" tabindex="-1">이메일을 보냈습니다.</h3>
                <p class="mail-success-description">문의해주셔서 감사합니다.</p>
                <button type="button" class="mail-close-button" onclick="closeEmailModal()">닫기</button>
            </div>
        </div>

        <div id="mailErrorContainer" class="mail-container-hidden" hidden>
            <div class="mail-error-message">
                <h3 class="mail-error-title" tabindex="-1" aria-describedby="mailErrorText">이메일을 보내지 못했습니다.</h3>
                <p class="mail-error-description" id="mailErrorText"></p>
                <div class="mail-error-actions">
                    <button type="button" class="mail-retry-button" onclick="retryEmail()">다시 시도</button>
                    <button type="button" class="mail-edit-button" onclick="editEmail()">내용 수정</button>
                    <button type="button" class="mail-close-button" onclick="closeEmailModal()">닫기</button>
                </div>
            </div>
        </div>
    </div>
</div>
