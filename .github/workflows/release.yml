name: Deploy portfolio

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, production]
    environment: production
    timeout-minutes: 20

    steps:
      - name: Deploy tagged release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail

          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

          PROJECT_DIR="/media/wire/Code Disk/portfolio"
          cd "$PROJECT_DIR"

          # 추적 중인 파일에 미커밋 변경이 있으면 배포를 중단합니다.
          git diff --quiet
          git diff --cached --quiet

          # origin에서 푸시된 태그를 가져와 해당 버전으로 전환합니다.
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git checkout --detach "$TAG"

          # Compose에서 참조하는 설정과 인증서 확인
          test -f .env
          test -f src/.env
          test -f src/certificates/cutwire.myddns.me-fullchain.pem
          test -f src/certificates/cutwire.myddns.me-key.pem

          # 기존 docker-compose.yml로 빌드 및 배포
          docker compose -f docker-compose.yml \
            up -d --build --remove-orphans --wait --wait-timeout 180

          docker compose -f docker-compose.yml ps